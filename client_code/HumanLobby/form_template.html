<div class="app-wrapper">
  <div class="hero">
    <div class="hero-text">
      <h2>Join your <span>partner's store</span></h2>
      <p>
        Your partner is running a candy store counter and has a room code for you.
        Type it in below to join — you'll be playing the customer, so just imagine
        you're stopping by to pick up some candy.
      </p>
    </div>
  </div>

  <div class="card">
    <label for="code-field" class="label-sm">Room code</label>
    <div id="code-field">
      <anvil-component type="TextBox" name="code_box" prop:placeholder="CANDY-XXXX"></anvil-component>
    </div>

    <anvil-component type="Label" name="error_label" prop:foreground="var(--uga-red)" prop:visible="false"></anvil-component>

    <div style="margin-top:20px;">
      <anvil-component type="Button" name="join_button" prop:text="Join" prop:role="btn-uga"></anvil-component>
    </div>
  </div>
</div>
