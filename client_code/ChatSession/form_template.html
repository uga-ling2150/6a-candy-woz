<div class="app-wrapper">
  <div class="hero">
    <div class="hero-text">
      <anvil-component type="Label" name="dialogue_label" prop:role="h1"></anvil-component>
      <p style="margin-top:6px;">
        Keep it natural — order candy, ask questions, change your mind, whatever
        feels real. When you're done with one exchange, start a fresh one below.
      </p>
    </div>
    <div class="progress-wrap">
      <div class="progress-badge">
        <anvil-component type="Label" name="timer_label" prop:text="10:00"></anvil-component>
      </div>
      <anvil-component type="Button" name="extend_button" prop:text="+2 minutes" prop:role="btn-uga-outline"></anvil-component>
    </div>
  </div>

  <anvil-component type="ColumnPanel" name="catalogue_panel">
    <div class="stage-body" style="margin-bottom:20px;">
      <div class="stage-title">Catalogue reference</div>
      <div class="table-scroll">
        <div class="data-row-head catalogue-row">
          <span>Item</span><span>Category</span><span>Price</span><span>Notes</span>
        </div>
        <anvil-component type="RepeatingPanel" name="catalogue_repeater" prop:item_template="Minimal_Theme_2.CatalogueItemTemplate"></anvil-component>
      </div>
    </div>
  </anvil-component>

  <div class="stage-body">
    <div class="stage-title">Your conversation</div>
    <div class="transcript-box">
      <anvil-component type="RepeatingPanel" name="transcript_repeater" prop:item_template="Minimal_Theme_2.ChatBubbleTemplate"></anvil-component>
    </div>

    <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;">
      <div style="flex:1; min-width:200px;">
        <anvil-component type="TextBox" name="message_box" prop:placeholder="Type your message..."></anvil-component>
      </div>
      <anvil-component type="Button" name="send_button" prop:text="Send" prop:role="btn-uga"></anvil-component>
    </div>

    <div style="margin-top:10px;">
      <anvil-component type="Button" name="new_dialogue_button" prop:text="End this dialogue, start a new one" prop:role="btn-uga-outline"></anvil-component>
    </div>
  </div>

  <anvil-component type="ColumnPanel" name="time_up_panel" prop:role="next-step-bar" prop:visible="false">
    <anvil-component type="Label" name="time_up_label" prop:text="Time's up! Head over to annotation to label the turns from your dialogues."></anvil-component>
    <anvil-component type="Button" name="go_to_annotation_button" prop:text="Go to annotation" prop:role="btn-uga"></anvil-component>
  </anvil-component>

  <anvil-component type="Timer" name="poll_timer" prop:interval="2"></anvil-component>
</div>
